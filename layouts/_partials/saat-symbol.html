{{- /* Kleine Zeichnung für die Sponsoring-Stufen: samen | keimling | setzling | baum | individuell */ -}}
{{- if eq . "samen" }}
<svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><ellipse cx="24" cy="30" rx="8" ry="11"/></svg>
{{- else if eq . "keimling" }}
<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M24 44V24"/><path d="M24 26c-8 0-12-5-12-11 7 0 12 4 12 11z" fill="currentColor"/></svg>
{{- else if eq . "setzling" }}
<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M24 44V16"/><path d="M24 30c-9 0-13-5-13-12 8 0 13 4 13 12z" fill="currentColor"/><path d="M24 22c8 0 12-5 12-12-7 0-12 4-12 12z" fill="currentColor"/></svg>
{{- else if eq . "baum" }}
<svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><circle cx="24" cy="17" r="13"/><rect x="21" y="26" width="6" height="18" rx="2"/></svg>
{{- else }}
<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M24 8v32M8 24h32"/></svg>
{{- end }}
