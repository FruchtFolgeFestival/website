# Prüft jede Änderung, bevor sie veröffentlicht wird. Deployt NICHTS
# (das macht ausschließlich Cloudflare Workers Builds).
#   - baut die Seite wie die Vorschau (dev)
#   - prüft interne Links (offline, ohne externe Seiten aufzurufen)
#   - prüft, dass die Seite keine externen Skripte/Schriften/Styles lädt
#   - bei Pull Requests nach main zusätzlich: Probe-Build der Produktion
name: Prüfen

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  vorschau:
    name: Vorschau bauen und prüfen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Hugo installieren (Version aus .hugo-version)
        run: |
          V="$(tr -d '[:space:]' < .hugo-version)"
          curl -fsSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${V}/hugo_extended_${V}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Seite bauen (wie Vorschau)
        run: BUILD_BRANCH=pruefung ./build.sh

      - name: Interne Links prüfen
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --include-fragments
            --root-dir "${{ github.workspace }}/public"
            'public/**/*.html'
          fail: true

      - name: Keine externen Ressourcen (außer im CMS unter /admin)
        run: |
          treffer="$(grep -rhoE '<(script|link|img|iframe|source|video|audio|embed|object)[^>]*>' public --include=*.html --exclude-dir=admin \
            | grep -E '(src|href)=("|)?(https?:)?//' | grep -vE 'rel=("|)?(canonical|alternate)' || true)"
          if [ -n "$treffer" ]; then
            echo "Externe Ressourcen gefunden – bitte entfernen (siehe docs/datenschutz-checkliste.md):"
            echo "$treffer"
            exit 1
          fi
          echo "OK: keine externen Ressourcen."

  produktion:
    name: Produktion probebauen
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Hugo installieren (Version aus .hugo-version)
        run: |
          V="$(tr -d '[:space:]' < .hugo-version)"
          curl -fsSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${V}/hugo_extended_${V}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
      - name: Seite bauen (wie Produktion)
        run: BUILD_BRANCH=main ./build.sh
