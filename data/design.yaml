# Farben der Webseite, im CMS unter „Design-Farben“.
# Die Werte werden über assets/css/farben.css zu CSS-Variablen (siehe layouts/_partials/farben/liste.html).
# Ausprobieren: in der Vorschau mit der Design-Werkstatt (Abschnitt „Farben“).
# Kontrast: Text braucht mindestens 4,5:1 zum Hintergrund. Sonst zeigt die Vorschau einen roten
# Hinweis und der Produktions-Build bricht ab.
