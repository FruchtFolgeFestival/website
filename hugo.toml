# Hugo-Konfiguration der Fruchtfolge-Webseite
# --------------------------------------------
# Hier steht nur Technik. Inhalte (Termine, Kontakt, Links …) stehen in
# data/festival.yaml und content/ und werden über das CMS (/admin) gepflegt.
#
# baseURL wird beim Build von build.sh überschrieben:
#   Produktion (Branch main): Build-Variable SITE_URL (Standard https://fruchtfolge.live/)
#   Vorschau (alle anderen Branches): "/"

baseURL = "https://fruchtfolge.live/"
title = "Fruchtfolge Festival"
# "locale" ersetzt seit Hugo 0.158 das veraltete "languageCode" (siehe docs/entscheidungen.md).
locale = "de-DE"
defaultContentLanguage = "de"
timeZone = "Europe/Berlin"
enableRobotsTXT = true
# Keine Schlagwort-/Kategorieseiten: brauchen wir nicht.
disableKinds = ["taxonomy", "term"]
# Seiten ohne Datum sollen nicht als "Zukunft" behandelt werden.
buildFuture = true

# RSS gibt es nur für die News (siehe content/news/_index.md).
[outputs]
  home = ["html"]
  section = ["html"]
  page = ["html"]

[pagination]
  pagerSize = 9
  path = "seite"

[permalinks]
  [permalinks.page]
    # Adresse = Dateiname (so passt sie immer zu dem, was das CMS anlegt)
    news = "/news/:contentbasename/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Kein rohes HTML in Markdown-Texten (Sicherheit, sauberes Layout).
      unsafe = false
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = false
        title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  resampleFilter = "CatmullRom"
  anchor = "Smart"
  [imaging.webp]
    quality = 78
  [imaging.jpeg]
    quality = 80

[sitemap]
  changeFreq = "weekly"
  filename = "sitemap.xml"

[params]
  # Diese Werte werden beim Build von build.sh gefüllt und im Vorschau-Banner gezeigt.
  buildbranch = ""
  buildcommit = ""
  buildzeit = ""

